                { name: "大寮區", baseLat: 22.605, baseLng: 120.395, count: 10 },
                { name: "鳥松區", baseLat: 22.658, baseLng: 120.365, count: 8 },
                { name: "林園區", baseLat: 22.502, baseLng: 120.392, count: 8 },
                { name: "路竹區", baseLat: 22.855, baseLng: 120.262, count: 8 }
            ];

            const placePrefixes = ["公園", "活動中心", "加油站", "市場", "圖書館分館", "捷運站Exit", "運動場", "停車場"];
            let idCounter = rawToiletData.length;

            districts.forEach(dist => {
                for (let i = 0; i < dist.count; i++) {
                    const offsetLat = (Math.random() - 0.5) * 0.045;
                    const offsetLng = (Math.random() - 0.5) * 0.045;
                    const prefix = placePrefixes[Math.floor(Math.random() * placePrefixes.length)];
                    const hasAcc = Math.random() > 0.35;
                    const hasNeu = Math.random() > 0.75;
                    const hasDia = Math.random() > 0.60;
                    const grades = ["特優級", "特優級", "優等級", "普通級"];
                    const grade = grades[Math.floor(Math.random() * grades.length)];

                    rawToiletData.push({
                        name: `${dist.name}${prefix}-${i + 1}號`,
                        address: `高雄市${dist.name}中正${i + 1}路${(i + 1) * 12}號`,
                        lat: parseFloat((dist.baseLat + offsetLat).toFixed(6)),
                        lng: parseFloat((dist.baseLng + offsetLng).toFixed(6)),
                        grade: grade,
                        features: {
                            hasAccessible: hasAcc,
                            hasGenderNeutral: hasNeu,
                            hasDiaper: hasDia,
                            hasMale: true,
                            hasFemale: true
                        },
                        subUnits: [
                            { name: "男廁", type: "男廁所", grade: grade },
                            { name: "女廁", type: "女廁所", grade: grade },
                            ...(hasAcc ? [{ name: "無障礙廁所", type: "無障礙廁所", grade: grade }] : []),
                            ...(hasNeu ? [{ name: "性別友善廁所", type: "多元性別廁所", grade: grade }] : [])
                        ]
                    });
                }
            });
        })();

        let map, markerClusterGroup;
        let allLocations = [...rawToiletData];
        let filteredLocations = [...rawToiletData];
        let userLocation = null;
        let userMarker = null;
        let markerMap = new Map(); // Maps location ID/Index to Marker instance

        // Initialize Map
        window.onload = function() {
            lucide.createIcons();
            initMap();
            setupEventListeners();
            renderSidebarList();
        };

        function initMap() {
            // Center on Kaohsiung City Hall / Central Kaohsiung
            map = L.map('map', {
                center: [22.6273, 120.3014],
                zoom: 13,
                zoomControl: false
            });

            // Position zoom control on top right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Tile Layer: OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Initialize Leaflet MarkerCluster Group with custom styling
            markerClusterGroup = L.markerClusterGroup({
                chunkedLoading: true,
                maxClusterRadius: 50,
                iconCreateFunction: function(cluster) {
                    const count = cluster.getChildCount();
                    let sizeClass = 'w-10 h-10 text-sm';
                    if (count > 50) sizeClass = 'w-12 h-12 text-base';
                    
                    return L.divIcon({
                        html: `<div class="custom-cluster ${sizeClass}"><span>${count}</span></div>`,
                        className: 'cluster-icon',
                        iconSize: L.point(40, 40)
                    });
                }
            });

            map.addLayer(markerClusterGroup);
            updateMapMarkers();
        }

        // Haversine distance formula in kilometers
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in KM
        }

        function formatDistance(distKm) {
            if (distKm < 1) {
                return `${Math.round(distKm * 1000)} m`;
            }
            return `${distKm.toFixed(1)} km`;
        }

        function applyFilters() {
            const searchValue = document.getElementById('search-input').value.trim().toLowerCase();
            const filterAcc = document.getElementById('filter-accessible').checked;
            const filterNeu = document.getElementById('filter-gender-neutral').checked;
            const filterDia = document.getElementById('filter-diaper').checked;
            const filterGrade = document.getElementById('filter-grade').value;

            filteredLocations = allLocations.filter(loc => {
                // Search query filter
                if (searchValue) {
                    const matchName = loc.name.toLowerCase().includes(searchValue);
                    const matchAddr = loc.address.toLowerCase().includes(searchValue);
                    if (!matchName && !matchAddr) return false;
                }

                // Features checkboxes
                if (filterAcc && !loc.features.hasAccessible) return false;
                if (filterNeu && !loc.features.hasGenderNeutral) return false;
                if (filterDia && !loc.features.hasDiaper) return false;

                // Grade filter
                if (filterGrade && loc.grade !== filterGrade) return false;

                return true;
            });

            // If user location is active, sort by nearest distance
            if (userLocation) {
                filteredLocations.sort((a, b) => (a._dist || 9999) - (b._dist || 9999));
            }

            document.getElementById('result-count').textContent = filteredLocations.length;
            updateMapMarkers();
            renderSidebarList();
        }

        function createMarkerIcon(loc) {
            const f = loc.features;
            
            // Determine primary icon background color based on special amenities
            let bgClass = 'bg-sky-600';
            if (f.hasAccessible && f.hasGenderNeutral) bgClass = 'bg-gradient-to-tr from-sky-600 to-purple-600';
            else if (f.hasAccessible) bgClass = 'bg-sky-600';
            else if (f.hasGenderNeutral) bgClass = 'bg-purple-600';
            else if (f.hasDiaper) bgClass = 'bg-amber-600';

            // Generate small overlay badges
            let badgesHTML = '';
            if (f.hasAccessible) badgesHTML += '<span class="text-[10px]">♿</span>';
            if (f.hasGenderNeutral) badgesHTML += '<span class="text-[10px]">⚧</span>';
            if (f.hasDiaper) badgesHTML += '<span class="text-[10px]">🍼</span>';

            const html = `
                <div class="relative group cursor-pointer">
                    <div class="${bgClass} text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-white hover:scale-110 transition">
                        <i data-lucide="bath" class="w-4 h-4"></i>
                    </div>
                    ${badgesHTML ? `
                        <div class="absolute -bottom-1 -right-1 bg-white px-1 rounded-full shadow border border-slate-200 flex items-center gap-0.5">
                            ${badgesHTML}
                        </div>
                    ` : ''}
                </div>
            `;

            return L.divIcon({
                html: html,
                className: 'custom-toilet-marker',
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });
        }

        function createPopupHTML(loc) {
            const f = loc.features;
            const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;

            // Amenity badges string - ONLY rendered if amenity is present
            let badgesHTML = '';
            if (f.hasAccessible) {
                badgesHTML += `<span class="inline-flex items-center gap-1 bg-sky-100 text-sky-800 text-xs px-2 py-0.5 rounded-full font-medium">♿ 無障礙</span>`;
            }
            if (f.hasGenderNeutral) {
                badgesHTML += `<span class="inline-flex items-center gap-1 bg-purple-100 text-purple-800 text-xs px-2 py-0.5 rounded-full font-medium">⚧ 多元性別</span>`;
            }
            if (f.hasDiaper) {
                badgesHTML += `<span class="inline-flex items-center gap-1 bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-medium">🍼 尿布台/親子</span>`;
            }

            // Grade badge design
            let gradeBadgeClass = "bg-slate-100 text-slate-700";
            if (loc.grade === "特優級") gradeBadgeClass = "bg-emerald-100 text-emerald-800 font-bold";
            else if (loc.grade === "優等級") gradeBadgeClass = "bg-blue-100 text-blue-800";

            // Breakdown sub-units list
            const subUnitsListHTML = loc.subUnits.map(unit => `
                <li class="flex items-center justify-between text-xs py-1 border-b border-slate-100 last:border-none">
                    <span class="text-slate-700">${unit.name}</span>
                    <span class="text-slate-400 text-[10px]">${unit.type}</span>
                </li>
            `).join('');

            return `
                <div class="p-4 space-y-3 font-sans">
                    <div>
                        <div class="flex items-start justify-between gap-2">
                            <h3 class="font-bold text-slate-900 text-base leading-snug">${loc.name}</h3>
                            <span class="text-[11px] px-2 py-0.5 rounded shrink-0 ${gradeBadgeClass}">${loc.grade}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                            <span>📍</span> ${loc.address}
                        </p>
                        ${loc._dist ? `<p class="text-xs text-emerald-600 font-semibold mt-0.5">距離目前位置 ${formatDistance(loc._dist)}</p>` : ''}
                    </div>

                    ${badgesHTML ? `<div class="flex flex-wrap gap-1.5 pt-1">${badgesHTML}</div>` : ''}

                    <div class="bg-slate-50 rounded-lg p-2.5 border border-slate-100">
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">設施明細</p>
                        <ul class="max-h-28 overflow-y-auto pr-1">
                            ${subUnitsListHTML}
                        </ul>
                    </div>

                    <a href="${googleNavUrl}" target="_blank" rel="noopener noreferrer" 
                       class="w-full flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs py-2.5 px-4 rounded-lg shadow-sm transition active:scale-95 text-center">
                        <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                        <span>Google Maps 導航</span>
                    </a>
                </div>
            `;
        }

        function updateMapMarkers() {
            markerClusterGroup.clearLayers();
            markerMap.clear();

            filteredLocations.forEach((loc, index) => {
                const marker = L.marker([loc.lat, loc.lng], {
                    icon: createMarkerIcon(loc)
                });

                marker.bindPopup(() => createPopupHTML(loc));
                markerClusterGroup.addLayer(marker);
                markerMap.set(loc.name + loc.address, marker);
            });
        }

        function renderSidebarList() {
            const listContainer = document.getElementById('toilet-list');
            listContainer.innerHTML = '';

            if (filteredLocations.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 px-4 text-slate-400">
                        <i data-lucide="map-pin-off" class="w-12 h-12 mx-auto mb-3 stroke-1 text-slate-300"></i>
                        <p class="text-sm font-medium">找不到符合條件的公廁</p>
                        <p class="text-xs mt-1">請嘗試清除關鍵字或放寬篩選條件</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filteredLocations.forEach((loc) => {
                const f = loc.features;
                
                let badgesHTML = '';
                if (f.hasAccessible) badgesHTML += `<span title="無障礙廁所" class="text-xs bg-sky-50 text-sky-700 px-1.5 py-0.5 rounded border border-sky-200">♿</span> `;
                if (f.hasGenderNeutral) badgesHTML += `<span title="多元性別廁所" class="text-xs bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded border border-purple-200">⚧</span> `;
                if (f.hasDiaper) badgesHTML += `<span title="尿布台/親子" class="text-xs bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded border border-amber-200">🍼</span> `;

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-sky-300 hover:shadow-md transition cursor-pointer group space-y-2";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="font-bold text-slate-800 text-sm group-hover:text-sky-600 transition leading-snug">${loc.name}</h4>
                        <span class="text-[10px] px-2 py-0.5 rounded font-medium shrink-0 ${
                            loc.grade === '特優級' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'
                        }">${loc.grade}</span>
                    </div>
                    
                    <p class="text-xs text-slate-500 line-clamp-1">📍 ${loc.address}</p>

                    <div class="flex items-center justify-between pt-1 text-xs">
                        <div class="flex items-center gap-1">${badgesHTML}</div>
                        
                        <div class="flex items-center gap-2">
                            ${loc._dist ? `<span class="text-xs font-bold text-emerald-600">${formatDistance(loc._dist)}</span>` : ''}
                            <button class="focus-btn flex items-center gap-1 text-sky-600 hover:text-sky-800 font-semibold text-xs py-1 px-2.5 rounded-lg bg-sky-50 hover:bg-sky-100 transition">
                                <span>定位</span>
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;

                // Click handler to zoom to location on map
                card.addEventListener('click', () => {
                    focusLocationOnMap(loc);
                    
                    // Close mobile sidebar if open
                    if (window.innerWidth < 768) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });

                listContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        function focusLocationOnMap(loc) {
            map.flyTo([loc.lat, loc.lng], 17, {
                animate: true,
                duration: 1.2
            });

            const markerKey = loc.name + loc.address;
            const marker = markerMap.get(markerKey);

            if (marker) {
                setTimeout(() => {
                    markerClusterGroup.zoomToShowLayer(marker, () => {
                        marker.openPopup();
                    });
                }, 400);
            }
        }

        function setupGeolocation() {
            const locateBtn = document.getElementById('locate-btn');
            
            if (!navigator.geolocation) {
                alert("您的瀏覽器不支援 GPS 地理定位功能");
                return;
            }

            locateBtn.addEventListener('click', () => {
                locateBtn.disabled = true;
                locateBtn.classList.add('opacity-75');

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        userLocation = { lat: latitude, lng: longitude };

                        // Add/Update user pulsing marker
                        if (userMarker) {
                            userMarker.setLatLng([latitude, longitude]);
                        } else {
                            const userIcon = L.divIcon({
                                html: '<div class="user-location-marker"></div>',
                                className: '',
                                iconSize: [20, 20],
                                iconAnchor: [10, 10]
                            });
                            userMarker = L.marker([latitude, longitude], { icon: userIcon }).addTo(map);
                            userMarker.bindTooltip("您的目前位置", { permanent: false, direction: 'top' });
                        }

                        // Calculate distances for all items
                        allLocations.forEach(loc => {
                            loc._dist = calculateDistance(latitude, longitude, loc.lat, loc.lng);
                        });

                        document.getElementById('user-dist-info').classList.remove('hidden');

                        // Re-apply filters and update map/list (will automatically sort by distance)
                        applyFilters();

                        // Center map on user
                        map.flyTo([latitude, longitude], 15);

                        locateBtn.disabled = false;
                        locateBtn.classList.remove('opacity-75');
                    },
                    (err) => {
                        alert("無法取得您的定位。請確認已開啟系統 GPS 與瀏覽器定位權限。");
                        locateBtn.disabled = false;
                        locateBtn.classList.remove('opacity-75');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        function setupEventListeners() {
            // Search input filter
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');

            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim().length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
                applyFilters();
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                applyFilters();
            });

            // Checkboxes
            document.getElementById('filter-accessible').addEventListener('change', applyFilters);
            document.getElementById('filter-gender-neutral').addEventListener('change', applyFilters);
            document.getElementById('filter-diaper').addEventListener('change', applyFilters);

            // Grade dropdown
            document.getElementById('filter-grade').addEventListener('change', applyFilters);

            // Reset filters
            document.getElementById('reset-filters-btn').addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                document.getElementById('filter-accessible').checked = false;
                document.getElementById('filter-gender-neutral').checked = false;
                document.getElementById('filter-diaper').checked = false;
                document.getElementById('filter-grade').value = '';
                applyFilters();
            });

            // Mobile sidebar toggles
            const sidebar = document.getElementById('sidebar');
            const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
            const mobileDrawerToggle = document.getElementById('mobile-drawer-toggle');

            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });

            mobileDrawerToggle.addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
            });

            setupGeolocation();
        }
    </script>
</body>
</html>
